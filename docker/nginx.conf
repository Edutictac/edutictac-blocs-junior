server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Capçaleres de seguretat (heretades per les locations que no definisquen add_header)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Tipus MIME que nginx no reconeix per defecte
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location ~* \.sjr$ {
        default_type application/zip;
        try_files $uri =404;
    }

    # Assets amb caché llarga (expires no sobreescriu els add_header de seguretat)
    location ~* \.(svg|png|jpg|jpeg|gif|woff2?|ttf|mp3|wav|mp4)$ {
        expires 30d;
        try_files $uri =404;
    }

    # HTML i service worker sense cache
    location = /service-worker.js {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }
    location = /home.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /home.html;
    }
}
