server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Tipus MIME que nginx no reconeix per defecte
    location ~* \.wasm$ {
        default_type application/wasm;
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }
    location ~* \.sjr$ {
        default_type application/zip;
    }

    # Assets amb caché llarga
    location ~* \.(svg|png|jpg|jpeg|gif|woff2?|ttf|mp3|wav|mp4|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML i service worker sense cache (control per versio)
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /home.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /home.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Permissions-Policy "camera=(), microphone=(self)";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
}
